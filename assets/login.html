<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · NanoRemoteDesktop</title>
  <style>
    :root { --bg:#0f1720; --panel:#162231; --muted:#8ea0b5; --text:#e7eef6; --accent:#4da3ff; --bad:#ff6b6b; --line:#243447; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:linear-gradient(180deg,#0c141d,#101b29); color:var(--text); }
    .panel { width:min(420px, calc(100vw - 32px)); background:rgba(22,34,49,.95); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 12px 40px rgba(0,0,0,.28); }
    h1 { margin:0 0 6px; font-size:24px; }
    .sub { color:var(--muted); font-size:14px; margin-bottom:22px; }
    label { display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); margin-bottom:14px; }
    input { background:#0f1925; color:var(--text); border:1px solid #30465f; border-radius:8px; padding:11px 12px; font-size:15px; }
    input:focus { outline:2px solid rgba(77,163,255,.35); border-color:var(--accent); }
    button { width:100%; background:var(--accent); color:#08111b; border:0; padding:11px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:15px; }
    button:hover { filter:brightness(1.05); }
    .err { color:var(--bad); font-size:13px; min-height:20px; margin-top:12px; }
  </style>
</head>
<body>
  <form class="panel" onsubmit="login(event)">
    <h1>NanoRemoteDesktop</h1>
    <div class="sub">Inicia sesión para acceder al dashboard</div>
    <label>Usuario
      <input id="user" name="username" autocomplete="username" required>
    </label>
    <label>Contraseña
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Entrar</button>
    <div id="err" class="err"></div>
  </form>
<script>
async function login(e) {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const username = document.getElementById('user').value;
  const password = document.getElementById('pass').value;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Login failed');
    location.href = '/';
  } catch (e) {
    err.textContent = e.message;
  }
}
</script>
</body>
</html>
