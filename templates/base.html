<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NanoRemoteDesktop{% endblock %}</title>
  <style>
    :root {
      --bg: #0b1118; --surface: #151f2e; --surface-2: #1a2738; --surface-3: #111925;
      --border: #26384d; --border-light: #314860;
      --text: #e8eef5; --muted: #93a4b8; --faint: #64788f;
      --accent: #3b82f6; --accent-hover: #4b91ff; --accent-soft: rgba(59,130,246,.12);
      --ok: #22c55e; --ok-soft: rgba(34,197,94,.12);
      --danger: #ef4444; --danger-soft: rgba(239,68,68,.1);
      --warn: #f59e0b; --warn-soft: rgba(245,158,11,.12);
      --radius: 12px; --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.15);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color:var(--text); font-size:14px; line-height:1.5; display:flex; flex-direction:column; overflow:hidden; }
    header { position:sticky; top:0; z-index:20; background:rgba(21,31,46,.85); backdrop-filter: blur(12px); border-bottom:1px solid var(--border); }
    .header-inner { max-width:1280px; margin:0 auto; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
    .logo { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#3b82f6,#2563eb); display:grid; place-items:center; font-weight:700; font-size:15px; color:#fff; flex-shrink:0; }
    h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:-.01em; }
    .sub { color:var(--muted); font-size:12px; }
    .header-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .tabs { display:flex; gap:2px; background:var(--surface-3); padding:3px; border-radius:9px; border:1px solid var(--border); }
    .tab { background:transparent; border:0; color:var(--muted); padding:7px 14px; border-radius:7px; cursor:pointer; font-weight:500; font-size:13px; transition:all .15s; text-decoration:none; display:inline-block; }
    .tab:hover { color:var(--text); }
    .tab.active { background:var(--surface-2); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.2); }
    main { max-width:1280px; width:100%; margin:0 auto; padding:24px; display:grid; gap:20px; flex:1; min-height:0; overflow:auto; align-content:start; }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
    .panel-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .panel-title { margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    label { display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:500; color:var(--muted); }
    input[type=text], input[type=file] { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px; font-size:13px; min-width:180px; transition:border-color .15s, box-shadow .15s; }
    input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    input[type=file] { padding:7px 10px; font-size:12px; }
    input[type=checkbox] { accent-color: var(--accent); width:16px; height:16px; }
    button { background:var(--surface-2); color:var(--text); border:1px solid var(--border); padding:8px 13px; border-radius:var(--radius-sm); cursor:pointer; font-weight:500; font-size:13px; transition:all .15s; white-space:nowrap; }
    button:hover { background:#22344a; border-color:var(--border-light); }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button.primary:hover { background:var(--accent-hover); }
    button.ghost { background:transparent; border-color:transparent; color:var(--muted); }
    button.ghost:hover { color:var(--text); background:var(--surface-2); }
    .btn-sm { padding:5px 10px; font-size:12px; border-radius:6px; }
    button.danger, .btn-sm.danger { background:var(--danger-soft); border-color:rgba(239,68,68,.25); color:#fca5a5; }
    button.danger:hover, .btn-sm.danger:hover { background:rgba(239,68,68,.18); }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; }
    .stat-card { background:var(--surface-3); border:1px solid var(--border); border-radius:10px; padding:16px; }
    .stat-label { font-size:12px; color:var(--muted); font-weight:500; margin-bottom:4px; }
    .stat-value { font-size:28px; font-weight:700; letter-spacing:-.02em; line-height:1.2; }
    .stat-value.ok { color:var(--ok); }
    .stat-value.danger { color:var(--danger); }
    .stat-value.muted-val { color:var(--muted); }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:separate; border-spacing:0; }
    th, td { padding:12px 14px; text-align:left; vertical-align:middle; font-size:13px; }
    th { color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.05em; background:var(--surface-3); border-bottom:1px solid var(--border); position:sticky; top:0; }
    th:first-child { border-radius:8px 0 0 0; }
    th:last-child { border-radius:0 8px 0 0; }
    td { border-bottom:1px solid rgba(38,56,77,.6); }
    tr:last-child td { border-bottom:0; }
    tbody tr:hover { background:rgba(59,130,246,.03); }
    .svc-name { font-weight:500; }
    .detail-cell { max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mono { font-variant-numeric: tabular-nums; font-size:12px; }
    .status-pill { display:inline-flex; align-items:center; gap:7px; font-weight:500; font-size:12px; padding:4px 10px 4px 8px; border-radius:99px; background:rgba(148,163,184,.1); color:var(--muted); }
    .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
    .status-pill.running, .status-pill.active { background:var(--ok-soft); color:#4ade80; }
    .status-pill.stopped, .status-pill.inactive, .status-pill.dead { background:rgba(148,163,184,.1); color:#94a3b8; }
    .status-pill.failed { background:var(--danger-soft); color:#f87171; }
    .status-pill.starting, .status-pill.stopping, .status-pill.activating, .status-pill.deactivating { background:var(--warn-soft); color:#fbbf24; }
    .badge { display:inline-block; padding:2px 7px; border-radius:5px; font-size:11px; font-weight:500; vertical-align:middle; }
    .badge-muted { background:rgba(148,163,184,.12); color:var(--muted); }
    .actions { display:flex; gap:6px; flex-wrap:wrap; }
    .muted { color:var(--muted); font-size:13px; }
    .err { color:#fca5a5; font-size:13px; margin-top:10px; }
    .err:empty { display:none; margin:0; }
    .empty-state { padding:40px 20px; text-align:center; }
    .empty-title { font-weight:500; margin-bottom:4px; }
    .empty { padding:24px 0; color:var(--muted); text-align:center; font-size:13px; }
    .history { margin-top:12px; padding:14px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); }
    .history h4 { margin:0 0 10px; font-size:12px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.04em; }
    .history table th, .history table td { padding:8px 10px; font-size:12px; }
    .hidden { display:none !important; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
    .modal { width:min(920px, 100%); max-height:calc(100vh - 40px); overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; }
    .modal-sm { width:min(720px, 100%); }
    @media (max-width: 900px) { .detail-cell { max-width:140px; } }
    @media (max-width: 720px) {
      th:nth-child(4), td:nth-child(4) { display:none; }
      .header-inner, main { padding-left:16px; padding-right:16px; }
      .stat-value { font-size:24px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/dashboard">
        <div class="logo">N</div>
        <div>
          <h1>NanoRemoteDesktop</h1>
          <div class="sub">Gestión y monitorización de servicios</div>
        </div>
      </a>
      <div class="header-right">
        <nav class="tabs">
          <a class="tab{% if active_tab == "dashboard" %} active{% endif %}" href="/dashboard">Dashboard</a>
          <a class="tab{% if active_tab == "services" %} active{% endif %}" href="/services">Servicios</a>
          <a class="tab{% if active_tab == "remote" %} active{% endif %}" href="/remote">Escritorio remoto</a>
        </nav>
        <button class="ghost" onclick="refreshPage()">Refrescar</button>
        <form method="post" action="/logout" style="margin:0"><button class="ghost" type="submit">Salir</button></form>
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
<script>
async function api(path, opts={}) {
  const res = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  if (res.status === 401) { location.href = '/login'; throw new Error('unauthorized'); }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
  if (!res.ok) throw new Error((data && data.error) || res.status + ' ' + res.statusText);
  return data;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(epoch) { if (!epoch) return '-'; return new Date(epoch * 1000).toLocaleString(); }
function statusClass(status) {
  status = (status || 'unknown').toLowerCase();
  if (['running','active'].includes(status)) return 'running';
  if (['stopped','inactive','dead'].includes(status)) return 'stopped';
  if (['failed'].includes(status)) return 'failed';
  if (['starting','activating','stopping','deactivating'].includes(status)) return 'starting';
  return '';
}
function refreshPage() { location.reload(); }
{% block scripts %}{% endblock %}
</script>
</body>
</html>
