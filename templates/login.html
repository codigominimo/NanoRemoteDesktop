<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · NanoRemoteDesktop</title>
  <style>
    :root {
      --bg: #0b1118; --surface: #151f2e; --surface-2: #1a2738; --border: #26384d;
      --text: #e8eef5; --muted: #93a4b8; --accent: #3b82f6; --accent-hover: #4b91ff;
      --danger: #ef4444; --danger-soft: rgba(239,68,68,.1); --radius: 12px;
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; background: radial-gradient(ellipse at top, #162338 0%, var(--bg) 60%); color:var(--text); }
    .panel { width:min(440px, 100%); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px; box-shadow: 0 4px 6px rgba(0,0,0,.12), 0 24px 48px rgba(0,0,0,.24); }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .logo { width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg, #3b82f6, #2563eb); display:grid; place-items:center; font-weight:700; font-size:18px; color:#fff; }
    h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.01em; }
    .sub { color:var(--muted); font-size:14px; margin-top:2px; }
    label { display:block; font-size:13px; font-weight:500; color:var(--muted); margin-bottom:6px; }
    .field { margin-bottom:18px; }
    input { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:11px 13px; font-size:14px; transition: border-color .15s, box-shadow .15s; }
    input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    button { width:100%; background:var(--accent); color:#fff; border:0; padding:11px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:14px; transition: background .15s; }
    button:hover { background:var(--accent-hover); }
    .err { margin-top:16px; padding:10px 12px; border-radius:8px; background:var(--danger-soft); color:#fca5a5; font-size:13px; border:1px solid rgba(239,68,68,.2); }
    .err:empty { display:none; }
  </style>
</head>
<body>
  <form class="panel" method="post" action="/login">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>NanoRemoteDesktop</h1>
        <div class="sub">Acceso al panel de administración</div>
      </div>
    </div>
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required value="{{ username }}" autofocus>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Iniciar sesión</button>
    {% if !error.is_empty() %}<div class="err">{{ error }}</div>{% else %}<div class="err"></div>{% endif %}
  </form>
</body>
</html>
