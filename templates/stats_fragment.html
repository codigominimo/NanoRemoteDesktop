<div class="stat-card">
  <div class="stat-label">Gestionados</div>
  <div class="stat-value">{{ total }}</div>
</div>
<div class="stat-card">
  <div class="stat-label">En ejecución</div>
  <div class="stat-value ok">{{ running }}</div>
</div>
<div class="stat-card">
  <div class="stat-label">Detenidos</div>
  <div class="stat-value danger">{{ stopped }}</div>
</div>
<div class="stat-card">
  <div class="stat-label">Fallidos</div>
  <div class="stat-value danger">{{ failed }}</div>
</div>
<div class="stat-card">
  <div class="stat-label">Otros / desconocido</div>
  <div class="stat-value muted-val">{{ other }}</div>
</div>
